name: Daily Intelligence Pipeline

on:
  schedule:
    - cron: "0 22 * * *"     # 每日 22:00 UTC 触发（= 北京时间 06:00，保证 7 点前出情报）
  workflow_dispatch:         # 允许手动运行
  push:
    paths:
      - "scripts/**"
      - "config.yaml"
      - "data/vocab.yaml"

permissions:
  contents: write
  issues: write             # 失败时自动建 Issue 告警

concurrency:
  group: daily-pipeline
  cancel-in-progress: false # 不取消正在跑的实例，排队执行，避免 raw 竞争

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: ① Fetch sources
        run: python scripts/fetch_sources.py

      - name: ② Normalize → events.csv
        run: python scripts/normalize.py

      - name: ③ Build briefings (daily + week/month/year boundary)
        # 统一按北京时间（UTC+8）命名日期，避免用户早上看到"昨天"的简报
        run: |
          python scripts/build_briefing.py --date "$(TZ=Asia/Shanghai date +%Y-%m-%d)"
          python scripts/build_briefing.py --date "$(TZ=Asia/Shanghai date +%Y-%m-%d)" --week
          python scripts/build_briefing.py --date "$(TZ=Asia/Shanghai date +%Y-%m-%d)" --month
          python scripts/build_briefing.py --date "$(TZ=Asia/Shanghai date +%Y-%m-%d)" --year

      - name: ⑤ Render Pages
        # 地图用 Leaflet + 公共瓦片（CARTO/OSM/Esri），无需任何地图 API key，GitHub Pages 直接可用
        run: python scripts/render_pages.py

      - name: ④ Validate (CI quality gate)
        run: python scripts/validate.py

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "auto: $(TZ=Asia/Shanghai date +%Y-%m-%d) pipeline run"
            git push
          fi

      - name: 🚨 Notify on failure
        if: failure()
        run: |
          # 失败自动建 Issue 告警（已存在未关闭的告警则不重复建）
          # 注意：全部用单行命令，避免多行字符串导致 YAML 块缩进/引号问题
          BODY="流水线失败，运行链接：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          EXISTS=$(gh issue list --repo "${{ github.repository }}" --state open --search "in:title 流水线失败" --json number --jq 'length' 2>/dev/null || echo 0)
          if [ "$EXISTS" = "0" ]; then
            gh issue create --repo "${{ github.repository }}" --title "⚠️ 流水线失败（自动告警）" --body "$BODY"
          else
            echo "已有未关闭的告警 Issue，跳过创建"
          fi
