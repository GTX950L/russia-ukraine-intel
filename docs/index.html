<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>俄乌战争每日情报</title>
<style>
  :root { --bg:#fff; --fg:#1a1a1a; --mut:#666; --bd:#e3e3e3; --acc:#185fa5; }
  * { box-sizing:border-box; }
  body { font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; margin:0; color:var(--fg); background:var(--bg); }
  header { padding:28px 20px 10px; border-bottom:1px solid var(--bd); }
  h1 { margin:0 0 4px; font-size:22px; }
  .sub { color:var(--mut); font-size:13px; }
  .wrap { max-width:1080px; margin:0 auto; padding:18px 20px 60px; }
  .stats { display:flex; gap:12px; flex-wrap:wrap; margin:16px 0; }
  .card { flex:1 1 140px; border:1px solid var(--bd); border-radius:12px; padding:14px; text-align:center; }
  .card .num { font-size:26px; font-weight:600; color:var(--acc); }
  .card .lbl { font-size:12px; color:var(--mut); margin-top:4px; }
  .filters { display:flex; gap:10px; flex-wrap:wrap; margin:10px 0 16px; }
  input,select { padding:8px 10px; border:1px solid var(--bd); border-radius:8px; font-size:13px; }
  input { flex:1 1 240px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { text-align:left; padding:9px 10px; border-bottom:1px solid var(--bd); vertical-align:top; }
  th { background:#fafafa; position:sticky; top:0; }
  .tag { display:inline-block; background:#eef3fb; color:var(--acc); border-radius:6px; padding:1px 7px; font-size:11px; margin-right:4px; }
  .disc { color:#b3401b; font-weight:600; }
  footer { color:var(--mut); font-size:12px; border-top:1px solid var(--bd); margin-top:30px; padding-top:14px; }
  a { color:var(--acc); }
</style>
</head>
<body>
<header><h1>俄乌战争每日情报</h1><div class="sub">中英双语 · 乌俄与第三方信源交叉对照 · NATO 可信度分级 ｜ 更新：2026-08-11 16:45 UTC</div></header>
<div class="wrap">
  <div class="stats"><div class="card"><div class="num">3</div><div class="lbl">事件总数</div></div><div class="card"><div class="num">2</div><div class="lbl">分歧事件</div></div><div class="card"><div class="num">3</div><div class="lbl">维度覆盖</div></div><div class="card"><div class="num">3</div><div class="lbl">战区覆盖</div></div></div>
  <div class="filters">
    <input id="q" placeholder="搜索关键词 / search...">
    <select id="fType"><option value="">全部维度</option></select>
    <select id="fTheater"><option value="">全部战区</option></select>
  </div>
  <table>
    <thead><tr><th>日期</th><th>战区</th><th>维度</th><th>事件（中/EN）</th><th>可靠</th><th>置信</th><th>来源方</th></tr></thead>
    <tbody id="tbody"></tbody>
  </table>
  <footer>
    非官方、开源、中立汇编，数据可能滞后或有误，仅供参考。原始数据：<a href="events.json">events.json</a>
    ｜ 简报：<a href="https://github.com/GTX950L/russia-ukraine-intel/tree/main/briefings">briefings/</a>
    ｜ 方法论：<a href="https://github.com/GTX950L/russia-ukraine-intel/tree/main/references">references/</a>
  </footer>
</div>
<script>
const EVENTS = [{"event_id": "2026-08-11-001", "date": "2026-08-11", "theater": "east-avdiivka", "event_type": "frontline", "title_zh": "阿夫迪夫卡西北方向发生小规模阵地交火（示例数据）", "title_en": "Small-scale positional clashes northwest of Avdiivka (sample data)", "summary_zh": "俄方宣称推进，乌方称已击退；独立第三方影像显示前线无明显变化。", "summary_en": "Russia claims advance; Ukraine says repelled; third-party imagery shows no major change.", "source_side": "third", "source_ua": "乌克兰总参谋部简报", "source_ru": "俄国防部通报", "source_third": "DeepStateMap", "url_ua": "", "url_ru": "", "url_third": "https://deepstatemap.org", "reliability": "B", "confidence": "3", "disagreement_flag": "yes", "disagreement_note_zh": "双方对“是否推进”说法相反，第三方影像未确认任何一侧控制变化。", "forecast_related": "no", "tags": "avdiivka;positional-warfare;sample", "editor": "system", "updated_at": "2026-08-11", "schema_version": "v1"}, {"event_id": "2026-08-11-002", "date": "2026-08-11", "theater": "south-zaporizhzhia", "event_type": "equipment", "title_zh": "扎波罗热方向记录到一辆俄军装甲车辆损失（示例数据）", "title_en": "One Russian armored vehicle loss recorded near Zaporizhzhia (sample data)", "summary_zh": "Oryx 基于影像确认一辆 T-72B3 被毁。", "summary_en": "Oryx confirmed one T-72B3 destroyed based on imagery.", "source_side": "third", "source_ua": "", "source_ru": "", "source_third": "Oryx", "url_ua": "", "url_ru": "", "url_third": "https://www.oryxspioenkop.com/", "reliability": "A", "confidence": "1", "disagreement_flag": "no", "disagreement_note_zh": "", "forecast_related": "no", "tags": "equipment-loss;t-72b3;sample", "editor": "system", "updated_at": "2026-08-11", "schema_version": "v1"}, {"event_id": "2026-08-10-003", "date": "2026-08-10", "theater": "political", "event_type": "diplomacy", "title_zh": "各方就人道走廊释放谈判表态（示例数据）", "title_en": "Parties comment on humanitarian-corridor negotiations (sample data)", "summary_zh": "乌方称俄方阻挠通道开放，俄方称已提供通道；第三方观察员记录到有限通行。", "summary_en": "Ukraine says Russia blocks corridors; Russia says corridors offered; third-party observers recorded limited passage.", "source_side": "third", "source_ua": "乌克兰总统府", "source_ru": "俄总统新闻秘书", "source_third": "UN OCHA", "url_ua": "", "url_ru": "", "url_third": "https://www.unocha.org/", "reliability": "C", "confidence": "3", "disagreement_flag": "yes", "disagreement_note_zh": "双方对“是否提供通道”说法相反，第三方确认仅有有限通行。", "forecast_related": "no", "tags": "diplomacy;humanitarian;sample", "editor": "pipeline", "updated_at": "2026-08-10", "schema_version": "v1"}];
const TYPE_ZH = {"frontline": "战线状况", "troops": "兵力状况", "equipment": "装备状况", "leadership": "军政领导人言行", "civilian": "平民状况", "external": "外部势力言行", "diplomacy": "外交谈判", "economy": "经济与制裁", "cyber": "网络/电子/认知战", "deterrence": "战略威慑(核态势)", "forecast": "未来推测"};
const THEATER_ZH = {"east-avdiivka": "东部-阿夫迪夫卡", "east-bakhmut": "东部-巴赫穆特", "east-donetsk": "东部-顿涅茨克", "east-luhansk": "东部-卢甘斯克", "south-kherson": "南部-赫尔松", "south-zaporizhzhia": "南部-扎波罗热", "south-crimea": "南部-克里米亚", "north-kharkiv": "北部-哈尔科夫", "border-kursk": "边境-库尔斯克", "black-sea": "黑海", "homeland-ru": "俄本土", "homeland-ua": "乌纵深", "political": "政治/全局", "economy": "经济/制裁", "cyber": "网络/认知", "deterrence": "战略威慑"};
const tbody = document.getElementById('tbody');
const q = document.getElementById('q');
const fType = document.getElementById('fType');
const fTheater = document.getElementById('fTheater');
function uniq(a){ return [...new Set(a)].filter(Boolean); }
uniq(EVENTS.map(e=>e.event_type)).forEach(t=>{ const o=document.createElement('option'); o.value=t; o.textContent=(TYPE_ZH[t]||t); fType.appendChild(o); });
uniq(EVENTS.map(e=>e.theater)).forEach(t=>{ const o=document.createElement('option'); o.value=t; o.textContent=(THEATER_ZH[t]||t); fTheater.appendChild(o); });
function render(){
  const kw=q.value.trim().toLowerCase(), ft=fType.value, fth=fTheater.value;
  const rows=EVENTS.filter(e=>{
    if(ft && e.event_type!==ft) return false;
    if(fth && e.theater!==fth) return false;
    if(kw){ const hay=(e.title_zh+' '+e.title_en+' '+e.summary_zh+' '+e.summary_en+' '+(e.tags||'')).toLowerCase(); if(!hay.includes(kw)) return false; }
    return true;
  });
  tbody.innerHTML = rows.map(e=>{
    const disc=(e.disagreement_flag||'').toLowerCase().startsWith('y');
    const tags=(e.tags||'').split(';').filter(Boolean).map(t=>'<span class="tag">'+t+'</span>').join('');
    return '<tr><td>'+(e.date||'')+'</td><td>'+(THEATER_ZH[e.theater]||e.theater||'')+'</td><td>'+(TYPE_ZH[e.event_type]||e.event_type||'')+'</td>'
      +'<td><b>'+(e.title_zh||'')+'</b> / '+(e.title_en||'')+'<br><span style="color:#666">'+(e.summary_zh||'')+'</span> '+tags+'</td>'
      +'<td>'+(e.reliability||'')+'</td><td>'+(e.confidence||'')+'</td>'
      +'<td>'+(disc?'<span class="disc">分歧</span>':(e.source_side||''))+'</td></tr>';
  }).join('') || '<tr><td colspan="7" style="color:#888">无匹配</td></tr>';
}
q.addEventListener('input', render);
fType.addEventListener('change', render);
fTheater.addEventListener('change', render);
render();
</script>
</body>
</html>
