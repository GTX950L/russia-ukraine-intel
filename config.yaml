# 全局配置 / Global configuration
# 注意：信源 URL 需维护者定期核验；启用(enabled:true)前请确认端点稳定可达。

project:
  name: russia-ukraine-intel
  title_zh: 俄乌战争每日情报
  title_en: Russia-Ukraine War Daily Intelligence
  editor: GTX950L
  lang: zh            # 默认叙述语言

pages:
  source_branch: main
  source_path: /docs
  base_url: https://gtx950l.github.io/russia-ukraine-intel

# 信源册：side ∈ {ua, ru, third}；reliability 为 NATO A-F 基线（详见 references/confidence_rubric.md）
# 注意：URL 与分支可能随上游漂移；启用前请确认端点稳定。VIINA 数据为 Git LFS，
# raw.githubusercontent.com 在 GitHub Actions(ubuntu) 上会自动解析 LFS，本地测试需用 gh api。
sources:
  - name: VIINA
    side: third
    type: events_csv
    format: zip            # 实为 zip 内含 CSV（Git LFS 存储）
    reliability: B
    url: https://raw.githubusercontent.com/zhukovyuri/VIINA/main/Data/event_1pd_latest_2026.zip
    parser: viina
    enabled: true          # 已核验路径(分支 main + LFS zip)；列映射在 normalize 中灵活处理，首次运行后核对日志
    note: "ACLED 式多源事件，乌+俄媒体双源；每年文件名变(_2026→_2027)，需年度更新 URL"
  - name: PetroIvaniuk-equipment
    side: third
    type: equipment_loss_json
    format: json
    reliability: B         # 基于 Oryx + 官方通报的累计装备损失
    url: https://raw.githubusercontent.com/PetroIvaniuk/2022-Ukraine-Russia-War-Dataset/main/data/russia_losses_equipment.json
    parser: petro_equipment
    enabled: true          # 已核验：1629 条每日累计记录，更新至当日
  - name: DeepStateMap
    side: third
    type: control_geojson
    format: geojson
    reliability: B
    url: https://deepstatemap.org/api/territories.geojson   # 端点不稳定，待核验
    parser: deepstate
    enabled: false         # 待适配器：领土控制快照，非离散事件，建议作为参考图层单独存
  - name: Oryx
    side: third
    type: equipment_loss
    format: html
    reliability: A
    url: https://www.oryxspioenkop.com/
    parser: oryx
    enabled: false         # 待适配器：HTML 页面，需稳定选择器，脆弱
  - name: Ukrainian-MoD
    side: ua
    type: official_report
    format: rss
    reliability: C
    url: https://www.mil.gov.ua/
    parser: rss
    enabled: false         # 待适配器：RSS/页面结构待确认
  - name: Russian-MoD
    side: ru
    type: official_report
    format: rss
    reliability: C
    url: https://eng.mil.ru/
    parser: rss
    enabled: false         # 待适配器：RSS/页面结构待确认
  - name: ISW
    side: third
    type: daily_report
    format: html
    reliability: A
    url: https://www.understandingwar.org/
    parser: isw
    enabled: false         # 待适配器：HTML 每日战报，需正文抽取

pipeline:
  fetch_timeout: 30          # 单源下载超时(秒)
  max_raw_age_days: 2        # raw 超过此天数视为过期
  default_reliability: C     # 未指定时的默认可靠性
  default_confidence: 3      # 未指定时的默认置信度
