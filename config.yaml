# =============================================================
# 全局配置 / Global configuration
# -------------------------------------------------------------
# 本文件由维护者与流水线共同消费 / Consumed by both maintainer and pipeline.
# 相关文档 / Related:
#   - 信源取舍与分类   → references/source_catalog.md
#   - 评级定义         → references/confidence_rubric.md
#   - 受控词表(权威)   → data/vocab.yaml
#   - 字段总表与约束   → AGENTS.md §3
#   - 主事件表版本     → SCHEMA_VERSION (当前 v1)
#
# 注意 / Note:
#   信源 URL 需维护者定期核验；启用(enabled:true)前请确认端点稳定可达。
#   VIINA 数据为 Git LFS，raw.githubusercontent.com 在 GitHub Actions(ubuntu)
#   上会自动解析 LFS，本地测试需用 `gh api`。
# =============================================================

# ---------- 项目元信息 / Project ----------
project:
  name: russia-ukraine-intel
  title_zh: 俄乌战争每日情报
  title_en: Russia-Ukraine War Daily Intelligence
  editor: GTX950L
  lang: zh            # 默认叙述语言 / default narrative language

# ---------- 站点发布 / Pages ----------
pages:
  source_branch: main
  source_path: /docs
  base_url: https://gtx950l.github.io/russia-ukraine-intel

# ---------- 信源册 / Sources ----------
# side ∈ {ua, ru, third}；reliability 为 NATO A–F 基线（详见 references/confidence_rubric.md）
# 注意：URL 与分支可能随上游漂移；启用前请确认端点稳定。
sources:
  - name: VIINA
    side: third
    type: events_csv
    format: zip            # 实为 zip 内含 CSV（Git LFS 存储）
    reliability: B
    url: https://raw.githubusercontent.com/zhukovyuri/VIINA/main/Data/event_1pd_latest_2026.zip
    parser: viina
    enabled: true          # 已核验路径(分支 main + LFS zip)；列映射在 normalize 中灵活处理，首次运行后核对日志
    note: "ACLED 式多源事件，乌+俄媒体双源；每年文件名变(_2026→_2027)，需年度更新 URL"
  - name: PetroIvaniuk-equipment
    side: third
    type: equipment_loss_json
    format: json
    reliability: B         # 基于 Oryx + 官方通报的累计装备损失
    url: https://raw.githubusercontent.com/PetroIvaniuk/2022-Ukraine-Russia-War-Dataset/main/data/russia_losses_equipment.json
    parser: petro_equipment
    enabled: true          # 已核验：1629 条每日累计记录，更新至当日
  - name: DeepStateMap
    side: third
    type: control_geojson
    format: geojson
    reliability: B
    url: https://api.github.com/repos/cyterat/deepstate-map-data/contents/data
    parser: deepstate
    enabled: true
    dynamic: github-latest          # fetch 用 GitHub API 取 data/ 下最新 deepstatemap_data_*.geojson
    pattern: deepstatemap_data_*.geojson
    note: "社区镜像每日更新(实测至当日)；单 feature 空属性，作战线快照图层；官方 live API 不稳定故用镜像"
  - name: Oryx
    side: third
    type: equipment_loss
    format: xml
    reliability: A
    url: https://www.oryxspioenkop.com/feeds/posts/default
    parser: oryx
    enabled: true
    note: "Blogspot Atom feed；自动抽取最新发布标题/日期，明细需人工核对(主清单为长文难自动计数)"
  - name: Ukrainian-MoD
    side: ua
    type: official_losses
    format: html
    reliability: C
    url: https://www.mil.gov.ua/
    parser: ua_mod
    enabled: true
    note: "首页含结构化单日损失数字(人员/坦克/火炮/无人机等)，可稳定抽取；与俄方宣称形成对照"
  - name: Russian-MoD
    side: ru
    type: official_briefing
    format: html
    reliability: C
    url: https://eng.mil.ru/en/
    parser: ru_mod
    enabled: true
    note: "每日作战简报；eng.mil.ru 可能从境外不可达，失败仅日志不阻断；正文抽取 best-effort"
  - name: ISW
    side: third
    type: daily_report
    format: html
    reliability: A
    url: https://www.understandingwar.org/russian-offensive-campaign-assessment
    parser: isw
    enabled: true
    note: "每日战报；RSS 被 403 拦截，改抓产品页抽取最新战报标题/链接(仅摘要，正文分析需人工/AI 复核)"

# ---------- 流水线参数 / Pipeline ----------
pipeline:
  fetch_timeout: 30          # 单源下载超时(秒) / per-source download timeout (s)
  max_raw_age_days: 2        # raw 超过此天数视为过期 / raw older than this is stale
  default_reliability: C     # 未指定时的默认可靠性 / fallback reliability
  default_confidence: 3      # 未指定时的默认置信度 / fallback confidence
